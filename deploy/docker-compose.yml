# Optional vector store for Kestrel memory.  Start:  docker compose -f deploy/docker-compose.yml up -d
# Then set `memory: {backend: qdrant}` in ~/.kestrel/config.yaml and run `kestrel memory reindex`.
services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"   # REST; bound to localhost only
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"

volumes:
  qdrant_data:
