[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kestrel-agent"
version = "0.3.0"
description = "Cadence: async, autonomous, local-first coder agent: projects, long-horizon goals, canvas, shared browser, MCP, skills, plugins and a web UI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "prompt_toolkit>=3.0",
    "mcp>=1.2",
    "PyYAML>=6.0",
    "aiohttp>=3.10",
    "pypdf>=4",
    "openpyxl>=3.1",
    "xlrd>=2",
    "Pillow>=10",
]

[project.optional-dependencies]
browser = ["playwright>=1.47"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "playwright>=1.47"]

[project.scripts]
cadence = "kestrel.cli:main"
kestrel = "kestrel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kestrel.web" = ["static/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
